[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-audio"
version = "0.1.0"
description = "Microphone and media audio mixing for WhatsApp calls on PipeWire"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
whatsapp-audio = "mixer:main"

[tool.setuptools]
py-modules = ["mixer"]
